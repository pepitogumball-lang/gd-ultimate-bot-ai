
name: Build GD Ultimate Bot AI - Android

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Geode mod for Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: RelWithDebInfo

      - name: Upload Android mod
        uses: actions/upload-artifact@v4
        with:
          name: GD-Ultimate-Bot-AI-Android64
          path: output/*.geode
          if-no-files-found: error
